[project]
name = "tg-trending-bot"
version = "0.1.0"
description = "Telegram-бот ИИ-аналитик для крипторынка: 130+ источников данных, слежки, навыки"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.25,<4",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "anthropic>=2.0",
    "pillow>=10.1",
    "segno>=1.5",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501"]
